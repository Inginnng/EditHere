name: Native macOS build
on:
  workflow_dispatch:
  push:
    branches: [native, codex/native]
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/**"
      - "schema/**"
      - "docs/**"
      - "packaging/**"
      - "connector/**"
      - "CMakeLists.txt"
      - "CHANGELOG.md"
      - "README.md"
      - "README.en.md"
      - ".github/workflows/**"
permissions:
  contents: read
jobs:
  macos:
    # Qt 6.8.3 links AGL, which is absent from the Xcode 26 SDK.
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify packaging and release invariants
        # Pure Python, no Qt or NSIS needed. The guards and the incidents they
        # prevent are recorded in docs/REGRESSIONS.md.
        run: python3 scripts/check-packaging.py
      - name: Verify pinned Xcode and SDK
        run: |
          xcodebuild -version
          sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
          printf 'SDK: %s\n' "$sdk_path"
          if [[ ! -d "$sdk_path/System/Library/Frameworks/AGL.framework" ]]; then
            echo "::error::The selected SDK lacks AGL.framework required by Qt 6.8.3. Keep this build on Xcode 16.4."
            exit 1
          fi
      - name: Install Qt and build tools
        run: |
          python3 -m venv .tools/python
          .tools/python/bin/pip install aqtinstall==3.3.0 ninja
          .tools/python/bin/python -m aqt install-qt mac desktop 6.8.3 clang_64 --modules qtimageformats --archives qtbase qtimageformats qttranslations --outputdir .tools/qt
      - name: Build and test universal app
        env:
          QT_ROOT: ${{ github.workspace }}/.tools/qt/6.8.3/macos
        run: |
          export PATH="$PWD/.tools/python/bin:$PATH"
          bash scripts/build-macos.sh
      - name: Validate exported files against the published schemas
        # The build above wrote real exports into artifacts/native-ui. The schemas are the
        # published contract, and nothing else compares them with what the writer produces, so a
        # rule the writer no longer honours (REG-112) would only surface in a bug report.
        run: |
          .tools/python/bin/pip install jsonschema==4.26.0
          .tools/python/bin/python scripts/validate-exports.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-build-results
          path: |
            dist/*.dmg
            artifacts/native-ui/
            build-macos/Testing/Temporary/LastTest.log
            build-macos/Testing/Temporary/LastTestsFailed.log
            build-macos/test-results.xml
            build-macos/build-environment.txt
          if-no-files-found: warn
