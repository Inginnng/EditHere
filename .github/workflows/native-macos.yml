name: Native macOS build
on:
  workflow_dispatch:
  push:
    branches: [native, codex/native]
  pull_request:
    paths: ["app/**", "tests/**", "CMakeLists.txt", "packaging/**", "scripts/build-macos.sh", ".github/workflows/native-macos.yml"]
permissions:
  contents: read
jobs:
  macos:
    # Qt 6.8.3 links AGL, which is absent from the Xcode 26 SDK.
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt and build tools
        run: |
          python3 -m venv .tools/python
          .tools/python/bin/pip install aqtinstall==3.3.0 ninja
          .tools/python/bin/python -m aqt install-qt mac desktop 6.8.3 clang_64 --modules qtimageformats --archives qtbase qtimageformats --outputdir .tools/qt
      - name: Build and test universal app
        env:
          QT_ROOT: ${{ github.workspace }}/.tools/qt/6.8.3/macos
        run: |
          export PATH="$PWD/.tools/python/bin:$PATH"
          bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-build-results
          path: |
            dist/*.dmg
            artifacts/native-ui/
            build-macos/Testing/Temporary/LastTest.log
          if-no-files-found: warn
