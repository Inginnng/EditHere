name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.8.22)"
        required: true
      validate_only:
        description: "Build and verify all packages without publishing"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8.3 MinGW and compiler
        run: |
          python -m pip install aqtinstall==3.3.0 ninja
          python -m aqt install-qt windows desktop 6.8.3 win64_mingw --modules qtimageformats qtmultimedia --archives qtbase qtsvg qtimageformats qtmultimedia qttranslations --outputdir .tools/qt
          python -m aqt install-tool windows desktop tools_mingw1310 qt.tools.win64_mingw1310 --outputdir .tools/qt

      - name: Build
        run: |
          $mingwBin = (Resolve-Path ".tools/qt/Tools/mingw1310_64/bin").Path
          $env:PATH = "$mingwBin;$env:PATH"
          scripts\build-windows.ps1 -QtRoot ".tools/qt/6.8.3/mingw_64" -Compiler "$mingwBin\g++.exe" -Ninja "ninja.exe" -SkipTests

      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          choco install ffmpeg -y --no-progress

      - name: Prepare real video decoding regression fixture
        run: |
          New-Item -ItemType Directory -Path build/test-fixtures -Force | Out-Null
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'testsrc2=size=1920x1080:rate=30' -t 120 -an -c:v libx264 -preset ultrafast -crf 35 -pix_fmt yuv420p -g 30 build/test-fixtures/seek.mp4
          if ($LASTEXITCODE) { throw 'Could not generate the video decoding fixture.' }
          $videoPath = (Resolve-Path 'build/test-fixtures/seek.mp4').Path
          "EDITHERE_VIDEO_TEST_SOURCE=$videoPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure English system OCR is available
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $engineType = [Windows.Media.Ocr.OcrEngine, Windows.Foundation, ContentType = WindowsRuntime]
          $languages = @($engineType::AvailableRecognizerLanguages | ForEach-Object { $_.LanguageTag })
          if ($languages -notcontains 'en-US') {
            Add-WindowsCapability -Online -Name 'Language.OCR~~~en-US~0.0.1.0' -ErrorAction Stop | Out-Null
            # Verify in a fresh Windows PowerShell process after installing the language.
            & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -Command '$t=[Windows.Media.Ocr.OcrEngine,Windows.Foundation,ContentType=WindowsRuntime]; if (@($t::AvailableRecognizerLanguages | ForEach-Object { $_.LanguageTag }) -notcontains "en-US") { throw "English system OCR is still unavailable after installation." }'
            if ($LASTEXITCODE) { throw 'English system OCR verification failed; video OCR regression tests cannot run.' }
          }

      - name: Verify capture regressions, startup updates and installer transactions
        env:
          EDITHERE_REQUIRE_VIDEO_OCR_TESTS: "1"
          QTEST_FUNCTION_TIMEOUT: "60000"
        run: |
          # Run without Qt or MinGW on PATH so this also verifies CTest's runtime setup.
          ctest --test-dir build --interactive-debug-mode 0 --output-on-failure --timeout 180 --output-junit build/test-results.xml -R '^(core|ui|image-set|ai-feedback|ai-instructions|agent-cli|windows-ipc-validation|video-ui|video-project|ocr|canvas-feedback|capture|windows-capture-colors|scrollstitch|scroll-controller|diagnostics|settings|startup-flow|updates|update-signatures|update-certificate-policy|update-signer)$'
          if ($LASTEXITCODE) {
            if (Test-Path 'build/agent-cli-test.log') { Get-Content 'build/agent-cli-test.log' }
            throw 'Capture, annotation, startup or update tests failed.'
          }
          $mingwBin = (Resolve-Path ".tools/qt/Tools/mingw1310_64/bin").Path
          $qtBin = (Resolve-Path ".tools/qt/6.8.3/mingw_64/bin").Path
          $env:PATH = "$qtBin;$mingwBin;$env:PATH"
          $env:NSIS_MAKENSIS = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          $env:EDITHERE_UPDATE_STUB = (Resolve-Path 'build/update_installer_stub.exe').Path
          python tests/installer_transaction_test.py
          if ($LASTEXITCODE) { throw 'Installer transaction tests failed.' }
          python tests/maintenance_test.py
          if ($LASTEXITCODE) { throw 'Installer maintenance tests failed.' }
          python tests/installer_shell_notification_test.py
          if ($LASTEXITCODE) { throw 'Native shell notification tests failed.' }
          python tests/installer_ui_flow_test.py
          if ($LASTEXITCODE) { throw 'Installer page flow tests failed.' }

      - name: Package portable ZIP
        run: |
          $mingwBin = (Resolve-Path ".tools/qt/Tools/mingw1310_64/bin").Path
          $env:PATH = "$mingwBin;$env:PATH"
          scripts\package-windows.ps1 -QtRoot ".tools/qt/6.8.3/mingw_64" -CompilerBin "$mingwBin"

      - name: Verify packaging and release invariants
        # Runs with NSIS installed and the portable ZIP already built, so the
        # installer is compiled for real (/WX) and the archive layout is checked
        # against the actual file. Guards the incidents in docs/REGRESSIONS.md.
        run: python scripts/check-packaging.py

      - name: Package NSIS installer
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          scripts\package-installer.ps1 -NsisCompiler $nsis

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.exe.sha256

  build-macos:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Verify pinned Xcode and SDK
        run: |
          xcodebuild -version
          sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
          printf 'SDK: %s\n' "$sdk_path"
          if [[ ! -d "$sdk_path/System/Library/Frameworks/AGL.framework" ]]; then
            echo "::error::The selected SDK lacks AGL.framework required by Qt 6.8.3."
            exit 1
          fi

      - name: Install Qt 6.8.3
        run: |
          python3 -m venv .tools/python
          .tools/python/bin/pip install aqtinstall==3.3.0 ninja
          .tools/python/bin/python -m aqt install-qt mac desktop 6.8.3 clang_64 --modules qtimageformats qtmultimedia --archives qtbase qtsvg qtimageformats qtmultimedia qttranslations --outputdir .tools/qt

      - name: Build and package
        env:
          QT_ROOT: ${{ github.workspace }}/.tools/qt/6.8.3/macos
          PATH_ADDITION: ${{ github.workspace }}/.tools/python/bin
        run: |
          export PATH="$PATH_ADDITION:$PATH"
          bash scripts/build-macos.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/*.dmg

  build-linux:
    # One definition of the Linux build: the same workflow that validates pull
    # requests produces the AppImage a tag publishes.
    uses: ./.github/workflows/native-linux.yml

  build-web:
    # The web packages are platform independent: one dependency-free build step
    # plus the committed MCP bundle, whose source/artifact hashes are checked
    # before packaging (scripts/prepare-distribution.py --web-only).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package the offline and web-agent ZIPs
        run: python3 scripts/prepare-distribution.py --web-only --channel release --output dist/web-dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/web-dist/**/*.zip

  release:
    needs: [build-windows, build-macos, build-linux, build-web]
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.validate_only }}
    runs-on: ubuntu-latest
    concurrency:
      group: github-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test draft asset verification
        run: node --test tests/release_assets_test.cjs

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish assets under version-less names
        # Documentation links use /releases/latest/download/<stable name>, so the
        # version must not appear in the asset names. The AppImage already comes
        # out of package-linux.sh under a stable name, so it is asserted here
        # rather than renamed.
        run: |
          cd artifacts
          shopt -s nullglob
          for f in EditHere-*-win-x64-setup.exe; do mv -f "$f" EditHere-win-x64-setup.exe; done
          for f in EditHere-*-win-x64.zip; do mv -f "$f" EditHere-win-x64.zip; done
          for f in EditHere-*-macos-universal.dmg; do mv -f "$f" EditHere-macos-universal.dmg; done
          # The web ZIPs arrive under web/<version>-<short>/; collect them by
          # name instead of predicting that depth (REG-157).
          find . -mindepth 2 -type f -name 'EditHere-*-web-agent-*.zip' -exec mv -f {} . \;
          find . -mindepth 2 -type f -name 'EditHere-*-web-*.zip' -not -name '*-web-agent-*' -exec mv -f {} . \;
          for f in EditHere-*-web-agent-*.zip; do mv -f "$f" EditHere-web-agent.zip; done
          for f in EditHere-*-web-*.zip; do mv -f "$f" EditHere-web.zip; done
          rm -f *.sha256 SHA256SUMS.txt
          # upload-artifact keeps only the path after the fixed prefix that
          # precedes the first wildcard, so dist/linux-*/<file> arrives under
          # linux-<version>/ and not under dist/. Collect the Linux files by
          # name instead of predicting that depth: a wrong guess is only
          # discovered after all three builds have run (REG-157).
          find . -mindepth 2 -type f \
            \( -name 'EditHere-linux-x86_64.AppImage' \
               -o -name 'EditHere-linux-x86_64.AppImage.sha256' \
               -o -name 'edithere-cli' \) \
            -exec mv -f {} . \;
          find . -mindepth 1 -type d -empty -delete
          [[ -s EditHere-linux-x86_64.AppImage ]] || {
            echo "::error::expected the Linux package at EditHere-linux-x86_64.AppImage"
            exit 1
          }
          ls -l

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          find . -type f \( -name "*.zip" -o -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" \) | sort | while read f; do
            sha256sum "$f"
          done > SHA256SUMS.txt
          cat SHA256SUMS.txt
          # Per-file hashes so the in-app updater can verify what it downloads,
          # and so the AppImage ships the checksum file its package script makes.
          for f in *.zip *.exe *.AppImage; do sha256sum "$f" > "$f.sha256"; done

      - name: Extract version from tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          test "$GITHUB_REF" = "refs/tags/$tag" || exit 1
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Extract release notes for this version
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib

          version = os.environ["VERSION"]
          translated = pathlib.Path("docs/releases/%s.en.md" % version)

          sw = "**简体中文** · [English](#english)"
          en_heading = "## English"

          def bilingual(chinese: str) -> str:
              """Fold the English notes into the Chinese body.

              GitHub and Gitee publish one Markdown body per release and neither
              has a language switch, so both languages share this page. The
              switcher sits at the top because the page opens on the Chinese
              section, and the English half is a real heading rather than a
              collapsed block: a link into a closed <details> would not expand
              it, so the switcher would land on nothing. Keeping the shape in
              one function means both note sources (the curated draft and the
              CHANGELOG section) stay bilingual for free.
              """
              if not translated.is_file():
                  print("::warning::%s is missing; the release page will be Chinese only." % translated)
                  return chinese.strip() + "\n"
              english = translated.read_text(encoding="utf-8").strip()
              return "%s\n\n%s\n\n---\n\n%s\n\n%s\n" % (
                  sw, chinese.strip(), en_heading, english)

          # A curated draft in docs/releases/<version>.md wins: the CHANGELOG
          # records history, the release page carries the user-facing summary.
          curated = pathlib.Path("docs/releases/%s.md" % version)
          if curated.is_file():
              pathlib.Path("release-notes.md").write_text(
                  bilingual(curated.read_text(encoding="utf-8")), encoding="utf-8")
              print("::notice::Using curated notes from %s" % curated)
              raise SystemExit(0)

          lines = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          section, capturing = [], False
          for line in lines:
              if line.startswith("## "):
                  if capturing:
                      break
                  capturing = re.match(r"^v?%s(?:\s|$)" % re.escape(version), line[3:].strip()) is not None
                  if capturing:
                      section.append(line)
              elif capturing:
                  section.append(line)
          while section and not section[-1].strip():
              section.pop()
          if not section:
              print("::warning::No CHANGELOG section found for %s; falling back to generated notes." % version)
          pathlib.Path("release-notes.md").write_text(bilingual("\n".join(section)), encoding="utf-8")
          PY
          cat release-notes.md

      - name: Require tag and source version to match
        env:
          INPUT_TAG: ${{ steps.version.outputs.tag }}
          REF: ${{ github.ref }}
        run: |
          test "$REF" = "refs/tags/$INPUT_TAG" || {
            echo "::error::workflow_dispatch must run from the same tag supplied as input"
            exit 1
          }
          expected="${INPUT_TAG#v}"
          actual="$(sed -nE 's/.*project\(EditHere VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)"
          test "$actual" = "$expected" || {
            echo "::error::CMake version does not match the release tag"
            exit 1
          }

      # The key is exposed only to this step on the tag release job. PR jobs
      # and platform builds receive no signing credentials. Sign final bytes
      # under their stable public name, after packaging/renaming/checksums.
      - name: Sign final Windows installer
        env:
          EDITHERE_UPDATE_SIGNING_KEY: ${{ secrets.EDITHERE_UPDATE_SIGNING_KEY }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: node scripts/sign-update.cjs --sign artifacts/EditHere-win-x64-setup.exe "$RELEASE_TAG"

      - name: Verify final Windows update signature without private key
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: node scripts/sign-update.cjs --verify artifacts/EditHere-win-x64-setup.exe "$RELEASE_TAG"

      - name: Require every package before publishing
        id: release-assets
        # Use one exact list for the local check, upload and remote check.
        run: |
          assets=(
            artifacts/EditHere-win-x64-setup.exe
            artifacts/EditHere-win-x64-setup.exe.sha256
            artifacts/EditHere-win-x64-setup.exe.sig
            artifacts/EditHere-win-x64.zip
            artifacts/EditHere-win-x64.zip.sha256
            artifacts/EditHere-macos-universal.dmg
            artifacts/EditHere-linux-x86_64.AppImage
            artifacts/EditHere-linux-x86_64.AppImage.sha256
            artifacts/EditHere-web.zip
            artifacts/EditHere-web.zip.sha256
            artifacts/EditHere-web-agent.zip
            artifacts/EditHere-web-agent.zip.sha256
            artifacts/edithere-cli
            artifacts/SHA256SUMS.txt
          )
          for asset in "${assets[@]}"; do
            [[ -f "$asset" && -s "$asset" ]] || {
              echo "::error::Missing or empty release asset: $asset"
              exit 1
            }
          done
          {
            echo 'paths<<EOF'
            printf '%s\n' "${assets[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Refuse to replace an already published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          published_tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | .tag_name')
          if grep -Fxq -- "$RELEASE_TAG" <<< "$published_tags"; then
            echo "::error::$RELEASE_TAG is already public. Release reruns may only upload to a draft."
            exit 1
          fi

      - name: Create GitHub Release draft
        id: draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          tag_name: ${{ steps.version.outputs.tag }}
          name: EditHere ${{ steps.version.outputs.version }}
          # The changelog section is prepended to the generated notes, which keep
          # the "Full Changelog" compare link.
          body_path: release-notes.md
          generate_release_notes: true
          files: ${{ steps.release-assets.outputs.paths }}

      - name: Verify uploaded draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          ASSET_PATHS: ${{ steps.release-assets.outputs.paths }}
        run: |
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          release_api="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          draft_json="$RUNNER_TEMP/edithere-draft.json"
          mapfile -t assets <<< "$ASSET_PATHS"
          # Read back the exact draft we uploaded, independently of the upload action.
          gh api "$release_api" > "$draft_json"
          node scripts/verify-release-assets.cjs "$draft_json" "$RELEASE_TAG" "${assets[@]}"
          gh api --method PATCH "$release_api" -F draft=false -f make_latest=legacy --jq '.html_url'
