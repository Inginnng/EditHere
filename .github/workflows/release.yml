name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.8.22)"
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8.3 MinGW and compiler
        run: |
          python -m pip install aqtinstall==3.3.0 ninja
          python -m aqt install-qt windows desktop 6.8.3 win64_mingw --modules qtimageformats --archives qtbase qtimageformats --outputdir .tools/qt
          python -m aqt install-tool windows desktop tools_mingw1310 qt.tools.win64_mingw1310 --outputdir .tools/qt

      - name: Build
        run: |
          $mingwBin = (Resolve-Path ".tools/qt/Tools/mingw1310_64/bin").Path
          $env:PATH = "$mingwBin;$env:PATH"
          scripts\build-windows.ps1 -QtRoot ".tools/qt/6.8.3/mingw_64" -Compiler "$mingwBin\g++.exe" -Ninja "ninja.exe" -SkipTests

      - name: Package portable ZIP
        run: |
          $mingwBin = (Resolve-Path ".tools/qt/Tools/mingw1310_64/bin").Path
          $env:PATH = "$mingwBin;$env:PATH"
          scripts\package-windows.ps1 -QtRoot ".tools/qt/6.8.3/mingw_64" -CompilerBin "$mingwBin"

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Package NSIS installer
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          scripts\package-installer.ps1 -NsisCompiler $nsis

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.exe.sha256

  build-macos:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Verify pinned Xcode and SDK
        run: |
          xcodebuild -version
          sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
          printf 'SDK: %s\n' "$sdk_path"
          if [[ ! -d "$sdk_path/System/Library/Frameworks/AGL.framework" ]]; then
            echo "::error::The selected SDK lacks AGL.framework required by Qt 6.8.3."
            exit 1
          fi

      - name: Install Qt 6.8.3
        run: |
          python3 -m venv .tools/python
          .tools/python/bin/pip install aqtinstall==3.3.0 ninja
          .tools/python/bin/python -m aqt install-qt mac desktop 6.8.3 clang_64 --modules qtimageformats --archives qtbase qtimageformats --outputdir .tools/qt

      - name: Build and package
        env:
          QT_ROOT: ${{ github.workspace }}/.tools/qt/6.8.3/macos
          PATH_ADDITION: ${{ github.workspace }}/.tools/python/bin
        run: |
          export PATH="$PATH_ADDITION:$PATH"
          bash scripts/build-macos.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/*.dmg

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish assets under version-less names
        # Documentation links use /releases/latest/download/<stable name>, so the
        # version must not appear in the asset names.
        run: |
          cd artifacts
          shopt -s nullglob
          for f in EditHere-*-win-x64-setup.exe; do mv -f "$f" EditHere-win-x64-setup.exe; done
          for f in EditHere-*-win-x64.zip; do mv -f "$f" EditHere-win-x64.zip; done
          for f in EditHere-*-macos-universal.dmg; do mv -f "$f" EditHere-macos-universal.dmg; done
          rm -f *.sha256 SHA256SUMS.txt
          ls -l

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          find . -type f \( -name "*.zip" -o -name "*.exe" -o -name "*.dmg" \) | sort | while read f; do
            sha256sum "$f"
          done > SHA256SUMS.txt
          cat SHA256SUMS.txt
          # Per-file hashes so the in-app updater can verify what it downloads.
          for f in *.zip *.exe; do sha256sum "$f" > "$f.sha256"; done

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this version
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib

          version = os.environ["VERSION"]
          lines = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          section, capturing = [], False
          for line in lines:
              if line.startswith("## "):
                  if capturing:
                      break
                  capturing = re.match(r"^v?%s(?:\s|$)" % re.escape(version), line[3:].strip()) is not None
                  if capturing:
                      section.append(line)
              elif capturing:
                  section.append(line)
          while section and not section[-1].strip():
              section.pop()
          if not section:
              print("::warning::No CHANGELOG section found for %s; falling back to generated notes." % version)
          pathlib.Path("release-notes.md").write_text("\n".join(section) + "\n", encoding="utf-8")
          PY
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: EditHere ${{ steps.version.outputs.version }}
          # The changelog section is prepended to the generated notes, which keep
          # the "Full Changelog" compare link.
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.exe.sha256
            artifacts/*.zip.sha256
            artifacts/*.dmg
            artifacts/SHA256SUMS.txt
