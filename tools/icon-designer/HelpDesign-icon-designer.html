<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EditHere · 图标工作台</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#202632;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:13px}button,input{font:inherit}button{cursor:pointer;border:1px solid #e1e5eb;background:white;border-radius:10px;padding:10px 16px;color:inherit}button:hover{background:#f0f4fa}button:focus-visible,input:focus-visible{outline:3px solid #95bbfa;outline-offset:3px}header{height:86px;max-width:1400px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:0 40px}.brand{display:flex;gap:12px;align-items:center}.brand-mark{display:grid;place-items:center;width:36px;height:36px;background:#2875f0;color:white;border-radius:11px;font-size:22px;font-weight:700}.brand strong{font-size:17px;letter-spacing:-.4px}.subtitle{display:block;font-size:11px;color:#9298a2;margin-top:3px}.actions{display:flex;gap:10px}.primary{background:#2875f0;color:white;border-color:#2875f0}.primary:hover{background:#1d64d4}.primary span{margin-left:18px}main{display:grid;grid-template-columns:minmax(0,1fr) 328px;max-width:1320px;margin:8px auto 36px;min-height:740px;background:white;border:1px solid #e7e9ee;border-radius:22px;overflow:hidden;box-shadow:0 12px 44px #26385806}.studio{padding:27px 34px;background:linear-gradient(145deg,#fafbfc,#f1f4f8);min-width:0}.preview-heading,.preview-footer{display:flex;justify-content:space-between;align-items:center;color:#818997;font-size:12px}.preview-heading label{display:flex;gap:7px;align-items:center}input[type=checkbox]{accent-color:#2875f0}.canvas{min-height:455px;display:grid;place-items:center;background-image:radial-gradient(#9baabe36 .7px,transparent .7px);background-size:18px 18px;margin:20px 0;border-radius:18px}.canvas svg{width:min(100%,480px);overflow:visible;touch-action:none;user-select:none}#pen{cursor:grab}#pen:active{cursor:grabbing}.preview-footer{font-size:11px}.samples{display:flex;justify-content:center;align-items:end;gap:32px;padding-top:36px}.sample{text-align:center;color:#939aa6;font-size:10px}.sample svg{display:block;margin:0 auto 10px}.hint{text-align:center;font-size:12px;color:#a0a6b0;margin:22px 0 0}aside{padding:25px 24px;border-left:1px solid #e9ecf1}.panel-title{display:flex;justify-content:space-between;align-items:center}h1{font-size:17px;margin:0}h2{font-size:12px;margin:0 0 19px;color:#626d7d;font-weight:600}.quiet{border:none;padding:6px 0;color:#8a94a3;font-size:11px}.control-group{padding-top:25px;margin-top:20px;border-top:1px solid #edf0f4}.control{margin-bottom:16px}.control-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.control label{font-size:12px;color:#596373}input[type=number]{width:75px;border:1px solid #e7eaf0;border-radius:7px;padding:5px 7px;background:#fafbfc;color:#364152;font-variant-numeric:tabular-nums;font-size:12px}input[type=range]{width:100%;height:4px;accent-color:#2875f0;cursor:pointer;display:block;margin:10px 0}input:disabled{opacity:.4;cursor:default}.note,.saved{color:#a0a7b2;font-size:10px;line-height:1.7}.lock-row{display:flex;align-items:center;justify-content:space-between;background:#f4f7fc;border-radius:10px;padding:12px;margin-bottom:20px}.lock-row strong{font-weight:500;font-size:12px}.lock-row small{display:block;color:#96a0ae;margin-top:4px;font-size:10px}.lock-row input{width:17px;height:17px}.saved{text-align:center;margin:23px 0 0}#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,12px);background:#263348;color:white;padding:12px 22px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s}#toast.show{opacity:1;transform:translate(-50%,0)}dialog{border:1px solid #e1e6ed;border-radius:18px;padding:26px;width:min(600px,90vw)}dialog::backdrop{background:#18233866}dialog textarea{width:100%;height:200px;margin-bottom:16px}dialog p{color:#7d8796} @media(max-width:850px){header{padding:0 20px}main{margin:0 16px 24px;grid-template-columns:minmax(0,1fr) 290px}.studio{padding:22px}.canvas{min-height:320px}aside{padding:22px 18px}.preview-footer{gap:12px}}@media(max-width:640px){header{height:78px;padding:0 16px}.actions{gap:6px}button{padding:9px 11px;font-size:12px}.primary span{display:none}.brand{gap:8px}.brand strong{font-size:14px}main{display:block}.canvas{min-height:260px}.canvas svg{max-width:350px}.studio{padding:20px}aside{border-left:0;border-top:1px solid #e9ecf1;padding:24px}.samples{padding-top:24px}.hint{margin-bottom:8px}}
</style></head>
<body><header><div class="brand"><span class="brand-mark">H</span><div><strong>EditHere · 改这里</strong><span class="subtitle">图标工作台</span></div></div><div class="actions"><button id="copy">复制 SVG</button><button id="download" class="primary">下载 SVG <span>↗</span></button></div></header>
<main><section class="studio"><div class="preview-heading"><span>实时预览</span><label><input id="guides" type="checkbox" checked>辅助线</label></div><div class="canvas"><svg id="preview" viewBox="8 6 52 52" role="img" aria-label="可调整的 EditHere 图标"><defs><linearGradient id="helpdesign-blue" gradientUnits="userSpaceOnUse" x1="48" y1="10" x2="16" y2="48"><stop offset="0" stop-color="#61ADFF"/><stop offset="1" stop-color="#3155D9"/></linearGradient></defs><path id="frame" fill="url(#helpdesign-blue)"/><path id="pen" fill="url(#helpdesign-blue)"/><g id="guide-lines" fill="none" stroke="#9BC3FF" stroke-width=".12" pointer-events="none"><path d="M 9 48 H 57" stroke-dasharray=".5 .5"/><path d="M 12 12 L 52 52" stroke-dasharray=".5 .7"/></g></svg></div><div class="preview-footer"><span id="alignment">底边已齐平 · Y 48.00</span><span>拖动笔，调整位置</span></div><div class="samples" id="samples"></div><p class="hint">从大轮廓，到每一个小圆角。</p></section>
<aside><div class="panel-title"><h1>精细调整</h1><button id="reset" class="quiet">恢复初始</button></div><section class="control-group"><h2>取景框</h2><div id="frame-controls"></div><p class="note">内外圆弧同心，边框等粗，保持 45° 对角线对称。</p></section><section class="control-group"><h2>笔</h2><div class="lock-row"><div><strong>底边与框齐平</strong><small>水平底边 · 两端圆滑</small></div><input id="lock" type="checkbox" role="switch" checked aria-label="底边与框齐平"></div><div id="pen-controls"></div></section><p class="saved">调整自动保存在此浏览器</p></aside></main>
<div id="toast" role="status" aria-live="polite"></div><dialog id="copy-dialog"><h2>复制 SVG</h2><p>选中下方内容，使用 Ctrl / ⌘ + C 复制。</p><textarea id="svg-text" aria-label="SVG 源码"></textarea><button id="close-dialog">完成</button></dialog><script>(function(root){
  const defaults={"radius":7.8,"width":5,"x":32.30555828147456,"y":32.2,"scale":1,"angle":-45,"tip":0.75,"shoulder":2.5,"lock":false};
  const n=v=>Number(v.toFixed(5));
  const pt=p=>`${n(p.x)} ${n(p.y)}`;
  function rounded(points,radii){
    const corners=points.map((v,i)=>{
      const prev=points[(i+points.length-1)%points.length],next=points[(i+1)%points.length];
      const l1=Math.hypot(v.x-prev.x,v.y-prev.y),l2=Math.hypot(next.x-v.x,next.y-v.y);
      const a={x:(v.x-prev.x)/l1,y:(v.y-prev.y)/l1},b={x:(next.x-v.x)/l2,y:(next.y-v.y)/l2};
      const turn=Math.atan2(a.x*b.y-a.y*b.x,a.x*b.x+a.y*b.y),factor=Math.abs(Math.tan(turn/2));
      const d=Math.min(radii[i]*factor,l1*.45,l2*.45),r=factor>1e-8?d/factor:0;
      return {entry:{x:v.x-a.x*d,y:v.y-a.y*d},exit:{x:v.x+b.x*d,y:v.y+b.y*d},r,sweep:turn>0?1:0};
    });
    return {corners,path:corners.map((c,i)=>`${i?'L':'M'} ${pt(c.entry)} ${c.r>1e-6?`A ${n(c.r)} ${n(c.r)} 0 0 ${c.sweep} ${pt(c.exit)}`:`L ${pt(c.exit)}`}`).join(' ')+' Z'};
  }
  function geometry(s){
    const R=s.radius,w=s.width,a=16+R,b=48-R,e=30,r=R-w,c=w/2;
    const frame=`M 48 ${64-e} V ${b} A ${R} ${R} 0 0 1 ${b} 48 H ${a} A ${R} ${R} 0 0 1 16 ${b} V ${a} A ${R} ${R} 0 0 1 ${a} 16 H ${e} A ${c} ${c} 0 0 1 ${e} ${16+w} H ${a} A ${r} ${r} 0 0 0 ${16+w} ${a} V ${b} A ${r} ${r} 0 0 0 ${a} ${48-w} H ${b} A ${r} ${r} 0 0 0 ${48-w} ${b} V ${64-e} A ${c} ${c} 0 0 1 48 ${64-e} Z`;
    const angle=s.angle*Math.PI/180,cos=Math.cos(angle),sin=Math.sin(angle);
    let points=[[0,0],[6.2,-3.7],[24,-3.7],[24,3.7],[6.2,3.7]].map(([x,y])=>({x:(x*cos-y*sin)*s.scale,y:(x*sin+y*cos)*s.scale}));
    if(s.lock){const base=points[4].y,offset=Math.max(0,.8*s.scale-points[1].x);points=points.map((p,i)=>i?{x:p.x+offset,y:p.y-base}:{x:0,y:0});}
    points=points.map(p=>({x:p.x+s.x,y:p.y+(s.lock?48:s.y)}));
    const pen=rounded(points,[s.tip,s.shoulder,1.4,1.4,s.shoulder].map(r=>r*s.scale));
    return {frame,pen:pen.path,corners:pen.corners,points};
  }
  function svg(s){const g=geometry(s);return `<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="8 6 52 52"><title>EditHere</title><metadata>${JSON.stringify(s)}</metadata><defs><linearGradient id="helpdesign-blue" gradientUnits="userSpaceOnUse" x1="48" y1="10" x2="16" y2="48"><stop offset="0" stop-color="#61ADFF"/><stop offset="1" stop-color="#3155D9"/></linearGradient></defs><path fill="url(#helpdesign-blue)" d="${g.frame}"/><path fill="url(#helpdesign-blue)" d="${g.pen}"/></svg>`;}
  root.HelpDesignGeometry={defaults,geometry,svg};
  if(typeof module!=='undefined')module.exports=root.HelpDesignGeometry;
})(globalThis);
</script><script>const G=HelpDesignGeometry,key='helpdesign-icon-designer-v5';
let state={...G.defaults};try{const saved=JSON.parse(localStorage.getItem(key));if(saved)for(const k in state)if(typeof saved[k]===typeof state[k])state[k]=saved[k];}catch{}
const specs=[['radius','外圆角',4.5,10,.05,'frame'],['width','边框粗细',1,6,.05,'frame'],['x','水平位置',10,42,.05,'pen'],['y','垂直位置',20,58,.05,'pen'],['scale','大小',.4,1.4,.01,'pen'],['angle','角度',-85,-5,.5,'pen'],['tip','笔尖圆弧',0,2,.05,'pen'],['shoulder','笔身过渡',0,6,.05,'pen']];
const $=id=>document.getElementById(id);
for(const [id,label,min,max,step,group]of specs){const row=document.createElement('div');row.className='control';row.innerHTML=`<div class="control-top"><label for="${id}-number">${label}</label><input id="${id}-number" type="number" min="${min}" max="${max}" step="${step}"></div><input id="${id}-range" aria-label="${label}滑块" type="range" min="${min}" max="${max}" step="${step}">`;$(group+'-controls').append(row);for(const suffix of ['number','range'])$(id+'-'+suffix).addEventListener('input',e=>{if(e.target.value===''||!Number.isFinite(e.target.valueAsNumber))return;state[id]=e.target.valueAsNumber;if(id==='width')state.radius=Math.max(state.radius,state.width+.5);if(id==='radius')state.width=Math.min(state.width,state.radius-.5);render();});}
function normalize(){for(const [id,,min,max]of specs)state[id]=Math.min(max,Math.max(min,Number.isFinite(state[id])?state[id]:G.defaults[id]));state.width=Math.min(state.width,state.radius-.5);if(state.lock)state.y=48;}
function render(){normalize();const g=G.geometry(state);$('frame').setAttribute('d',g.frame);$('pen').setAttribute('d',g.pen);for(const [id]of specs)for(const suffix of ['number','range']){const input=$(id+'-'+suffix);input.value=Number(state[id].toFixed(2));input.disabled=id==='y'&&state.lock;}$('lock').checked=state.lock;$('alignment').textContent=state.lock?'底边已齐平 · Y 48.00':'自由位置 · Y '+state.y.toFixed(2);$('samples').innerHTML=[16,24,32,48].map(size=>`<div class="sample">${G.svg(state).replace('width="512" height="512"',`width="${size}" height="${size}"`)}${size} px</div>`).join('');try{localStorage.setItem(key,JSON.stringify(state));}catch{}}
$('lock').addEventListener('change',e=>{state.lock=e.target.checked;render();});$('guides').addEventListener('change',e=>$('guide-lines').style.display=e.target.checked?'':'none');$('reset').onclick=()=>{state={...G.defaults};render();toast('已恢复初始参数');};
let timer;function toast(text){$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.remove('show'),2200);}
$('download').onclick=()=>{const url=URL.createObjectURL(new Blob([G.svg(state)],{type:'image/svg+xml'}));const a=document.createElement('a');a.href=url;a.download='EditHere.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('SVG 已导出');};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(G.svg(state));toast('SVG 已复制');}catch{$('svg-text').value=G.svg(state);$('copy-dialog').showModal();$('svg-text').focus();$('svg-text').select();}};$('close-dialog').onclick=()=>$('copy-dialog').close();
let drag;function position(e){return new DOMPoint(e.clientX,e.clientY).matrixTransform($('preview').getScreenCTM().inverse());}
$('pen').addEventListener('pointerdown',e=>{if(e.button!==0)return;const p=position(e);drag={id:e.pointerId,p,x:state.x,y:state.y};$('pen').setPointerCapture(e.pointerId);e.preventDefault();});$('pen').addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const p=position(e);state.x=drag.x+p.x-drag.p.x;if(!state.lock)state.y=drag.y+p.y-drag.p.y;render();});for(const type of ['pointerup','pointercancel','lostpointercapture'])$('pen').addEventListener(type,()=>drag=null);
render();
</script></body></html>
