<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EditHere · 图标工作台</title><link rel="stylesheet" href="styles.css"></head>
<body><header><div class="brand"><span class="brand-mark">H</span><div><strong>EditHere · 改这里</strong><span class="subtitle">图标工作台</span></div></div><div class="actions"><button id="copy">复制 SVG</button><button id="download" class="primary">下载 SVG <span>↗</span></button></div></header>
<main><section class="studio"><div class="preview-heading"><span>实时预览</span><label><input id="guides" type="checkbox" checked>辅助线</label></div><div class="canvas"><svg id="preview" viewBox="8 6 52 52" role="img" aria-label="可调整的 EditHere 图标"><defs><linearGradient id="helpdesign-blue" gradientUnits="userSpaceOnUse" x1="48" y1="10" x2="16" y2="48"><stop offset="0" stop-color="#61ADFF"/><stop offset="1" stop-color="#3155D9"/></linearGradient></defs><path id="frame" fill="url(#helpdesign-blue)"/><path id="pen" fill="url(#helpdesign-blue)"/><g id="guide-lines" fill="none" stroke="#9BC3FF" stroke-width=".12" pointer-events="none"><path d="M 9 48 H 57" stroke-dasharray=".5 .5"/><path d="M 12 12 L 52 52" stroke-dasharray=".5 .7"/></g></svg></div><div class="preview-footer"><span id="alignment">底边已齐平 · Y 48.00</span><span>拖动笔，调整位置</span></div><div class="samples" id="samples"></div><p class="hint">从大轮廓，到每一个小圆角。</p></section>
<aside><div class="panel-title"><h1>精细调整</h1><button id="reset" class="quiet">恢复初始</button></div><section class="control-group"><h2>取景框</h2><div id="frame-controls"></div><p class="note">内外圆弧同心，边框等粗，保持 45° 对角线对称。</p></section><section class="control-group"><h2>笔</h2><div class="lock-row"><div><strong>底边与框齐平</strong><small>水平底边 · 两端圆滑</small></div><input id="lock" type="checkbox" role="switch" checked aria-label="底边与框齐平"></div><div id="pen-controls"></div></section><p class="saved">调整自动保存在此浏览器</p></aside></main>
<div id="toast" role="status" aria-live="polite"></div><dialog id="copy-dialog"><h2>复制 SVG</h2><p>选中下方内容，使用 Ctrl / ⌘ + C 复制。</p><textarea id="svg-text" aria-label="SVG 源码"></textarea><button id="close-dialog">完成</button></dialog><script src="geometry.js"></script><script src="app.js"></script></body></html>
